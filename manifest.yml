modules:
  jira:issuePanel:
    - key: triage-lens-issue-panel
      resource: main
      resolver:
        function: resolver
      render: native
      title: TriageLens
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: main
    path: src/frontend/index.jsx
permissions:
  scopes:
    - read:jira-work
app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/43d20348-8a1e-4987-857d-1f68d3ef4243
  name: triage-lens
